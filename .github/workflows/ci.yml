name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_APP_NAME: Afenda ERP
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_STAGE: ci
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Turborepo remote cache
        run: pnpm env:verify:turbo

      - name: Initialize test artifact directories
        run: pnpm artifacts:init

      - name: GUARD 1 + GUARD 2 — ERP layout
        run: pnpm guard:erp

      - name: Format check
        run: pnpm format

      - name: Root script typecheck
        run: pnpm typecheck:scripts

      - name: Monorepo typecheck, lint, test, and build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm ci:turbo:affected
          else
            pnpm ci:turbo
          fi

      - name: Check directory architecture
        run: pnpm architecture:check

      - name: Verify AI Gateway model registry
        run: pnpm ai:verify:gateway-models

      - name: Lint governed renderers
        run: pnpm lint:governed-renderers

      - name: Lint governed renderer contracts
        run: pnpm lint:governed-renderer-contracts

      - name: Audit streaming skeleton parity
        run: pnpm audit:skeleton-parity

      - name: Audit list surface chrome
        run: pnpm audit:list-surface-chrome

      - name: Knip dependency hygiene (advisory)
        continue-on-error: true
        run: pnpm knip:ci

      - name: Check test artifact layout
        if: always()
        run: pnpm artifacts:check

      - name: Upload Vitest artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-artifacts
          path: |
            .artifacts/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize test artifact directories
        run: pnpm artifacts:init

      - name: Install Playwright browser
        run: pnpm --filter @afenda/erp exec playwright install chromium --with-deps

      - name: Build ERP for E2E
        run: pnpm --filter @afenda/erp build
        env:
          CI: "true"

      - name: E2E and visual regression (single server boot)
        run: pnpm --filter @afenda/erp test:e2e:ci
        env:
          CI: "true"
          AFENDA_DEV_AUTH_BYPASS: "0"
          AFENDA_NEON_AUTH_ENABLED: "0"
          AFENDA_E2E_DEV_AUTH: "1"
          NODE_ENV: production

      - name: Check test artifact layout
        if: always()
        run: pnpm artifacts:check

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e
          path: |
            .artifacts/playwright/
          retention-days: 14
          if-no-files-found: ignore

  e2e-neon:
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ secrets.NEON_AUTH_BASE_URL != '' && secrets.NEON_AUTH_COOKIE_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize test artifact directories
        run: pnpm artifacts:init

      - name: Install Playwright browser
        run: pnpm --filter @afenda/erp exec playwright install chromium --with-deps

      - name: Build ERP for Neon Auth E2E
        run: pnpm --filter @afenda/erp build
        env:
          CI: "true"
          AFENDA_DEV_AUTH_BYPASS: "0"
          AFENDA_NEON_AUTH_ENABLED: "1"
          NEXT_PUBLIC_AFENDA_NEON_AUTH_ENABLED: "1"
          AFENDA_E2E_DEV_AUTH: "0"
          NODE_ENV: production
          NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}

      - name: Neon Auth E2E smoke
        run: pnpm --filter @afenda/erp test:e2e:neon
        env:
          CI: "true"
          AFENDA_DEV_AUTH_BYPASS: "0"
          AFENDA_NEON_AUTH_ENABLED: "1"
          NEXT_PUBLIC_AFENDA_NEON_AUTH_ENABLED: "1"
          AFENDA_E2E_DEV_AUTH: "0"
          NODE_ENV: production
          NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}

      - name: Check test artifact layout
        if: always()
        run: pnpm artifacts:check

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-neon
          path: |
            .artifacts/playwright/
          retention-days: 14
          if-no-files-found: ignore
