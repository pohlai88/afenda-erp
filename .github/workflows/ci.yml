name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize test artifact directories
        run: pnpm artifacts:init

      - name: Typecheck
        run: pnpm typecheck

      - name: Check directory architecture
        run: pnpm architecture:check

      - name: Verify AI Gateway model registry
        run: pnpm ai:verify:gateway-models

      - name: Lint governed renderers
        run: pnpm lint:governed-renderers

      - name: Unit tests
        run: pnpm test

      - name: Check test artifact layout
        if: always()
        run: pnpm artifacts:check

      - name: Upload Vitest artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-artifacts
          path: |
            .artifacts/
          retention-days: 14
          if-no-files-found: ignore

      - name: Build monorepo
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_NAME: Afenda ERP
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_STAGE: ci

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize test artifact directories
        run: pnpm artifacts:init

      - name: Install Playwright browser
        run: pnpm --filter @afenda/erp exec playwright install chromium --with-deps

      - name: E2E smoke tests
        run: pnpm test:e2e
        env:
          CI: "true"
          AFENDA_DEV_AUTH_BYPASS: "0"
          AFENDA_NEON_AUTH_ENABLED: "0"
          AFENDA_E2E_DEV_AUTH: "1"
          NODE_ENV: production
          NEXT_PUBLIC_APP_NAME: Afenda ERP
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_STAGE: ci

      - name: Check test artifact layout
        if: always()
        run: pnpm artifacts:check

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e
          path: |
            .artifacts/playwright/
          retention-days: 14
          if-no-files-found: ignore

  e2e-neon:
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ secrets.NEON_AUTH_BASE_URL != '' && secrets.NEON_AUTH_COOKIE_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize test artifact directories
        run: pnpm artifacts:init

      - name: Install Playwright browser
        run: pnpm --filter @afenda/erp exec playwright install chromium --with-deps

      - name: Neon Auth E2E smoke
        run: pnpm --filter @afenda/erp exec playwright test tests/e2e/smoke.spec.ts --grep "Neon Auth smoke"
        env:
          CI: "true"
          AFENDA_DEV_AUTH_BYPASS: "0"
          AFENDA_NEON_AUTH_ENABLED: "1"
          NEXT_PUBLIC_AFENDA_NEON_AUTH_ENABLED: "1"
          AFENDA_E2E_DEV_AUTH: "0"
          NODE_ENV: production
          NEXT_PUBLIC_APP_NAME: Afenda ERP
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_STAGE: ci
          NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}

      - name: Check test artifact layout
        if: always()
        run: pnpm artifacts:check

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-neon
          path: |
            .artifacts/playwright/
          retention-days: 14
          if-no-files-found: ignore
